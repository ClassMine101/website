<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClassMine101</title>
    <meta name="description" content="ClassMine101 is being rebuilt from scratch." />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(60rem 60rem at 50% -10%, #1d2a4a 0%, #0b1020 55%, #070a14 100%);
        color: #e8ecf8;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .card { max-width: 34rem; }
      .mark {
        font-size: 0.8rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #7f8db3;
        margin: 0 0 1rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 9vw, 4rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(120deg, #ffffff, #8fb4ff 60%, #b18cff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { margin: 1rem 0 0; color: #9aa7c7; line-height: 1.6; }
      a { color: #8fb4ff; }
      .bar { height: 3px; width: 5rem; margin: 1.75rem auto 0; border-radius: 99px; background: linear-gradient(90deg, #4f7dff, #a06bff); }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="mark">classmine101.com</p>
      <h1>ClassMine101</h1>
      <p>This site is being rebuilt from scratch. A new release is on the way.</p>
      <div class="bar"></div>
    </main>
  </body>
</html>
